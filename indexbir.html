<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>www.sybyzghy.com — Sanandyq Sybyzghy</title>
    <style>
        :root {
            --bg-color: #060a07;
            --card-bg: #0f1610;
            --accent-color: #d4af37;
            --accent-glow: rgba(212, 175, 55, 0.4);
            --text-color: #e2e8f0;
            --secondary-text: #94a3b8;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 24px;
            padding: 25px;
            max-width: 550px;
            width: 94%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        h1 {
            color: var(--accent-color);
            font-size: 1.6rem;
            margin-bottom: 5px;
            letter-spacing: 1.5px;
        }

        p {
            color: var(--secondary-text);
            font-size: 0.85rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Sybyzghı sūlbatı paneli */
        .sybyzghy-pipe {
            position: relative;
            background: linear-gradient(90deg, #162218, #233325, #162218);
            border: 2px solid var(--accent-color);
            border-radius: 50px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 20px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 0 20px var(--accent-glow);
        }

        .ornament-node {
            width: 45px;
            height: 45px;
            background-color: rgba(212, 175, 55, 0.1);
            border: 2px dashed var(--accent-color);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            user-select: none;
        }

        .ornament-node span {
            font-size: 0.75rem;
            color: var(--accent-color);
            font-weight: bold;
        }

        .ornament-node:active, .ornament-node.active {
            background-color: var(--accent-color);
            border-style: solid;
            box-shadow: 0 0 25px var(--accent-color);
            transform: scale(1.12);
        }

        .ornament-node.active span {
            color: var(--bg-color);
        }

        .slider-section {
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .slider-label {
            font-size: 0.8rem;
            color: var(--secondary-text);
            margin-bottom: 5px;
            display: block;
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .info-box {
            font-size: 0.75rem;
            color: var(--secondary-text);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>www.sybyzghy.com</h1>
        <p>Taza fizika, obertondıq qonyray äri tau keñistigi jañğyryğy arqyly jūratin sanandyq sybyzghy.</p>

        <div class="sybyzghy-pipe" id="sybyzghyPipe">
            <div class="ornament-node" data-freq="261.63"><span>I</span></div>
            <div class="ornament-node" data-freq="293.66"><span>II</span></div>
            <div class="ornament-node" data-freq="329.63"><span>III</span></div>
            <div class="ornament-node" data-freq="392.00"><span>IV</span></div>
            <div class="ornament-node" data-freq="440.00"><span>V</span></div>
            <div class="ornament-node" data-freq="523.25"><span>VI</span></div>
        </div>

        <div class="slider-section">
            <span class="slider-label">Aua ağyny men Jiilikti tegis basqaru</span>
            <input type="range" id="pitchSlider" min="200" max="600" value="440" step="1">
        </div>

        <div class="info-box">
            Ojuulardy basıp, tabigi sybyzghynyñ üni men syryldauın tolyq seziñiz.
        </div>
    </div>

    <script>
        let audioCtx = null;
        let masterGain = null;
        let activeOscillatorsMap = new Map();

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                masterGain = audioCtx.createGain();
                masterGain.gain.setValueAtTime(0.35, audioCtx.currentTime);

                // Tabigi tauda tartılğanday keñistikti jañğyryq (Delay Echo + Feedback Filter)
                const delay = audioCtx.createDelay();
                delay.delayTime.setValueAtTime(0.22, audioCtx.currentTime);
                
                const delayFeedback = audioCtx.createGain();
                delayFeedback.gain.setValueAtTime(0.3, audioCtx.currentTime); // Jañğyryq qandylyğy

                const delayFilter = audioCtx.createBiquadFilter();
                delayFilter.type = 'lowpass';
                delayFilter.frequency.setValueAtTime(1500, audioCtx.currentTime); // Žūmsaq jañğyryq üşin süzgi

                masterGain.connect(delay);
                delay.connect(delayFilter);
                delayFilter.connect(delayFeedback);
                delayFeedback.connect(delay);

                masterGain.connect(audioCtx.destination);
                delay.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function startNote(nodeId, frequency) {
            initAudio();
            if (activeOscillatorsMap.has(nodeId)) return;

            const now = audioCtx.currentTime;

            // Sybyzghyğa tängi terek obertondyq qatar (Sine + Triangleqospasy)
            const freqs = [frequency, frequency * 2, frequency * 3, frequency * 4];
            const gains = [1.0, 0.5, 0.22, 0.08];
            let nodeElements = [];

            freqs.forEach((f, idx) => {
                const osc = audioCtx.createOscillator();
                // 1-garmonika syryldau üşin sine/triangle, qalğandarı sine
                osc.type = idx === 0 ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(f, now);

                const oscGain = audioCtx.createGain();
                oscGain.gain.setValueAtTime(0, now);
                oscGain.gain.linearRampToValueAtTime(gains[idx] * 0.28, now + 0.08);

                osc.connect(oscGain);
                oscGain.connect(masterGain);
                osc.start(now);
                nodeElements.push({ osc, gain: oscGain });
            });

            // 1. Aua syryldauı (Breathy Noise - qūbyr işindegi aua aģyny)
            const bufferSize = audioCtx.sampleRate * 2;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = (Math.random() * 2 - 1);
            }

            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            whiteNoise.loop = true;

            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.setValueAtTime(frequency * 1.6, now);
            noiseFilter.Q.setValueAtTime(6.0, now); // Tarınyñ rezonansy

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0, now);
            noiseGain.gain.linearRampToValueAtTime(0.06, now + 0.1);

            whiteNoise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(masterGain);
            whiteNoise.start(now);

            // 2. Tabigi mikrotolqyn (Micro-vibrato jan beru)
            const vibrato = audioCtx.createOscillator();
            vibrato.frequency.setValueAtTime(5.8, now);
            const vibratoGain = audioCtx.createGain();
            vibratoGain.gain.setValueAtTime(3.8, now);
            
            nodeElements.forEach(item => {
                vibrato.connect(item.osc.frequency);
            });
            vibrato.start(now);

            activeOscillatorsMap.set(nodeId, {
                elements: nodeElements,
                noise: whiteNoise,
                noiseGain: noiseGain,
                vibrato: vibrato
            });
        }

        function stopNote(nodeId) {
            if (activeOscillatorsMap.has(nodeId) && audioCtx) {
                const now = audioCtx.currentTime;
                const noteData = activeOscillatorsMap.get(nodeId);

                noteData.elements.forEach(item => {
                    item.gain.gain.linearRampToValueAtTime(0.001, now + 0.12);
                });
                noteData.noiseGain.gain.linearRampToValueAtTime(0.001, now + 0.12);

                setTimeout(() => {
                    try {
                        noteData.elements.forEach(item => item.osc.stop());
                        noteData.noise.stop();
                        noteData.vibrato.stop();
                    } catch(e) {}
                    activeOscillatorsMap.delete(nodeId);
                }, 130);
            }
        }

        document.querySelectorAll('.ornament-node').forEach((node, index) => {
            const freq = parseFloat(node.getAttribute('data-freq'));
            const nodeId = 'node_' + index;

            const handleStart = (e) => {
                e.preventDefault();
                node.classList.add('active');
                startNote(nodeId, freq);
                document.getElementById('pitchSlider').value = freq;
            };

            const handleEnd = (e) => {
                e.preventDefault();
                node.classList.remove('active');
                stopNote(nodeId);
            };

            node.addEventListener('touchstart', handleStart);
            node.addEventListener('touchend', handleEnd);
            node.addEventListener('mousedown', handleStart);
            node.addEventListener('mouseup', handleEnd);
            node.addEventListener('mouseleave', () => {
                if(node.classList.contains('active')) {
                    node.classList.remove('active');
                    stopNote(nodeId);
                }
            });
        });

        const slider = document.getElementById('pitchSlider');
        slider.addEventListener('input', (e) => {
            const baseFreq = parseFloat(e.target.value);
            activeOscillatorsMap.forEach((noteData, id) => {
                const freqs = [baseFreq, baseFreq * 2, baseFreq * 3, baseFreq * 4];
                noteData.elements.forEach((item, idx) => {
                    if(audioCtx) {
                        item.osc.frequency.setTargetAtTime(freqs[idx], audioCtx.currentTime, 0.04);
                    }
                });
            });
        });
    </script>
</body>
</html>
