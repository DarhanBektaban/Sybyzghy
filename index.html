<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>www.sybyzghy.com — Sanandyq Sybyzghy</title>
    <style>
        :root {
            --bg-color: #080c09;
            --card-bg: #121a13;
            --accent-color: #d4af37;
            --ornament-hover: #f39c12;
            --text-color: #e2e8f0;
            --secondary-text: #94a3b8;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 24px;
            padding: 25px;
            max-width: 550px;
            width: 94%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        h1 {
            color: var(--accent-color);
            font-size: 1.6rem;
            margin-bottom: 5px;
            letter-spacing: 1.5px;
        }

        p {
            color: var(--secondary-text);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        /* Sybyzghı sūlbatı / Ojuular konteyneri */
        .sybyzghy-pipe {
            position: relative;
            background: linear-gradient(90deg, #1e2b20, #2c3e30, #1e2b20);
            border: 2px solid var(--accent-color);
            border-radius: 50px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 20px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 15px rgba(212,175,55,0.2);
        }

        /* Ärbir ojuu / tesik elementteri */
        .ornament-node {
            width: 45px;
            height: 45px;
            background-color: rgba(212, 175, 55, 0.15);
            border: 2px dashed var(--accent-color);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            user-select: none;
        }

        .ornament-node span {
            font-size: 0.7rem;
            color: var(--accent-color);
            font-weight: bold;
        }

        .ornament-node:active, .ornament-node.active {
            background-color: var(--accent-color);
            border-style: solid;
            box-shadow: 0 0 20px var(--accent-color);
            transform: scale(1.1);
        }

        .ornament-node.active span {
            color: var(--bg-color);
        }

        .slider-section {
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .slider-label {
            font-size: 0.8rem;
            color: var(--secondary-text);
            margin-bottom: 5px;
            display: block;
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .info-box {
            font-size: 0.75rem;
            color: var(--secondary-text);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>www.sybyzghy.com</h1>
        <p>Ūlttyq ojuu-örnekterge tikeley basyp, sybyzghynyñ syrly syryldau ünin zharatyñyz.</p>

        <!-- Sybyzghı nūsqasındagı ojuular paneli -->
        <div class="sybyzghy-pipe" id="sybyzghyPipe">
            <div class="ornament-node" data-freq="261.63"><span>I</span></div>
            <div class="ornament-node" data-freq="293.66"><span>II</span></div>
            <div class="ornament-node" data-freq="329.63"><span>III</span></div>
            <div class="ornament-node" data-freq="392.00"><span>IV</span></div>
            <div class="ornament-node" data-freq="440.00"><span>V</span></div>
            <div class="ornament-node" data-freq="523.25"><span>VI</span></div>
        </div>

        <div class="slider-section">
            <span class="slider-label">Aua ağyny men Jiilikti tegis basqaru</span>
            <input type="range" id="pitchSlider" min="200" max="600" value="440" step="1">
        </div>

        <div class="info-box">
            Birneshe ojuudy qatar basyp, sybyzghynyñ qabatar şyqqan üni men syryldauyn seziñiz.
        </div>
    </div>

    <script>
        let audioCtx = null;
        let masterGain = null;
        let activeNoise = null;
        let activeNoiseGain = null;
        let activeVibrato = null;
        let activeOscillatorsMap = new Map(); // Birneshe ojuu ūstinde birdey dybys üşin

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Master Gain & Global Noise (Birlikke keltirilgen aua syryldauı)
                masterGain = audioCtx.createGain();
                masterGain.gain.setValueAtTime(0.3, audioCtx.currentTime);

                // Keñistikti jañğyryq (Delay Echo)
                const delay = audioCtx.createDelay();
                delay.delayTime.setValueAtTime(0.2, audioCtx.currentTime);
                const delayGain = audioCtx.createGain();
                delayGain.gain.setValueAtTime(0.25, audioCtx.currentTime);

                masterGain.connect(delay);
                delay.connect(delayGain);
                delayGain.connect(delay);

                masterGain.connect(audioCtx.destination);
                delay.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function startNote(nodeId, frequency) {
            initAudio();
            if (activeOscillatorsMap.has(nodeId)) return; // Eger basuvly bolsa

            const now = audioCtx.currentTime;

            // Obertondar (Triangle + Sines)
            const freqs = [frequency, frequency * 2, frequency * 3];
            const gains = [1.0, 0.45, 0.2];
            let nodeOscillators = [];

            freqs.forEach((f, idx) => {
                const osc = audioCtx.createOscillator();
                osc.type = idx === 0 ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(f, now);

                const oscGain = audioCtx.createGain();
                oscGain.gain.setValueAtTime(0, now);
                oscGain.gain.linearRampToValueAtTime(gains[idx] * 0.3, now + 0.1);

                osc.connect(oscGain);
                oscGain.connect(masterGain);
                osc.start(now);
                nodeOscillators.push({ osc, gain: oscGain });
            });

            activeOscillatorsMap.set(nodeId, nodeOscillators);
        }

        function stopNote(nodeId) {
            if (activeOscillatorsMap.has(nodeId) && audioCtx) {
                const now = audioCtx.currentTime;
                const nodeOscillators = activeOscillatorsMap.get(nodeId);

                nodeOscillators.forEach(item => {
                    item.gain.gain.linearRampToValueAtTime(0.001, now + 0.15);
                });

                setTimeout(() => {
                    nodeOscillators.forEach(item => {
                        try { item.osc.stop(); } catch(e) {}
                    });
                    activeOscillatorsMap.delete(nodeId);
                }, 160);
            }
        }

        // Ojuu (ornament) elementterine tirkew
        document.querySelectorAll('.ornament-node').forEach((node, index) => {
            const freq = parseFloat(node.getAttribute('data-freq'));
            const nodeId = 'node_' + index;

            const handleStart = (e) => {
                e.preventDefault();
                node.classList.add('active');
                startNote(nodeId, freq);
                document.getElementById('pitchSlider').value = freq;
            };

            const handleEnd = (e) => {
                e.preventDefault();
                node.classList.remove('active');
                stopNote(nodeId);
            };

            node.addEventListener('touchstart', handleStart);
            node.addEventListener('touchend', handleEnd);
            node.addEventListener('mousedown', handleStart);
            node.addEventListener('mouseup', handleEnd);
            node.addEventListener('mouseleave', () => {
                if(node.classList.contains('active')) {
                    node.classList.remove('active');
                    stopNote(nodeId);
                }
            });
        });

        // Slider arqyly bar lapyldau/jiilikti basqaru
        const slider = document.getElementById('pitchSlider');
        slider.addEventListener('input', (e) => {
            const baseFreq = parseFloat(e.target.value);
            // Eger aktivti ojuu bolsa, solardyn jiiligin birdey özgertu
            activeOscillatorsMap.forEach((nodeOscillators, id) => {
                const freqs = [baseFreq, baseFreq * 2, baseFreq * 3];
                nodeOscillators.forEach((item, idx) => {
                    if(audioCtx) {
                        item.osc.frequency.setTargetAtTime(freqs[idx], audioCtx.currentTime, 0.05);
                    }
                });
            });
        });
    </script>
</body>
</html>
